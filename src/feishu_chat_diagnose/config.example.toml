# 默认位置：~/.feishu-diagnose/config.toml
# 配置内相对路径均相对于本配置文件所在目录；路径支持 ~。

[defaults]
# 未传 --since 或 --start/--end 时使用的消息时间窗口。
message_window = "2h"
# 案例根目录；默认 ~/.feishu-diagnose/cases/，init 可创建空目录。
# 只有进入代码诊断阶段后才创建单个 case、checkpoint、报告或执行日志。
case_dir = "cases"
# 最终诊断消息数量上限（含必要根消息与引用祖先）；超限报错，不截断。
# 此限制不用于截断前置分类的候选消息。
max_messages = 300
# 前置分类独立限制候选消息数和正文大小；超限提示缩小范围，不截断、不创建 case。
max_triage_messages = 1000
# 聊天正文、项目别名及描述合计的 UTF-8 字节数（256 KiB）。
max_triage_text_bytes = 262144
# 单个文本附件最多读取的字节数（1 MiB）。
max_text_attachment_bytes = 1048576

[feishu]
# 普通命令名通过 PATH 查找，也可以填写可执行文件路径。
lark_cli_bin = "lark-cli"

[codex]
bin = "codex"
# 前置分类、Skill 适用性评估和代码诊断共用此模型；留空使用 Codex 默认模型。
model = ""
# 单次 RPC 请求的总等待上限，以及事件流等待下一条完整消息的上限。
timeout_seconds = 600
# 每个独立 Codex 会话的执行总时限，包含初始化和模型分析；进度消息不会延长。
# 分类、Skill 评估、代码诊断分别计时；显式 resume 使用新会话。
total_timeout_seconds = 1800

[video_tool]
provider = "dashscope"
# 使用已开通且支持视频理解的模型。
model = "qwen3-vl-plus"
# 填写所用地域或网关的 OpenAI 兼容 Base URL，通常以 /compatible-mode/v1 结尾。
# 本地视频按 Base64 传入，编码后须小于 10 MB（原文件约小于 7.5 MB）。
base_url = ""
# 环境变量 DASHSCOPE_API_KEY 优先；未设置时使用此值。请自行填入对应服务的 Key，勿提交到 Git。
api_key = ""
timeout_seconds = 300

# 添加允许诊断的仓库，命令通过 --repo example 选择。
# [repositories.example]
# path = "/absolute/path/to/project"
# 前置分类仅使用别名、此描述、聊天正文和消息关系；请写明项目职责和业务范围。
# description = "文档编辑器，负责富文本编辑、文档导入与导出"
# Skill 位于目标仓库的 .agents/skills/<name>/SKILL.md；符号链接不得越出仓库，
# 且 SKILL.md 不得越出解析后的 skills 目录；留空则不指定。
# 仅在需要代码分析后评估适用性；不适合或不明确时跳过，使用通用只读分析。
# diagnosis_skill = "project-bugfix"
# --skill 只允许选择本仓库默认 Skill 或以下白名单中的名称。
# allowed_skills = ["canvas-bugfix", "performance-diagnosis"]
