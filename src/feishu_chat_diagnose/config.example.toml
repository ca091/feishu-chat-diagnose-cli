# 默认位置：~/.feishu-diagnose/config.toml
# 配置内相对路径均相对于本配置文件所在目录；路径支持 ~。

[defaults]
# 未传 --since 或 --start/--end 时使用的消息时间窗口。
message_window = "2h"
# 案例、checkpoint、报告与执行日志；默认 ~/.feishu-diagnose/cases/。
case_dir = "cases"
# 最终组装的消息数量上限（含引用与话题补全）；超限报错，不截断。
max_messages = 300
# 单个文本附件最多读取的字节数（1 MiB）。
max_text_attachment_bytes = 1048576

[feishu]
# 普通命令名通过 PATH 查找，也可以填写可执行文件路径。
lark_cli_bin = "lark-cli"

[codex]
bin = "codex"
# 留空使用 Codex 默认模型。
model = ""
# 等待下一条完整 Codex 响应或事件的超时秒数，不是整个诊断的总时限。
timeout_seconds = 600

[video_tool]
provider = "gemini"
# 填写已开通的视频模型；GEMINI_API_KEY 通过环境变量提供。
model = ""
timeout_seconds = 300

# 添加允许诊断的仓库，命令通过 --repo example 选择。
# [repositories.example]
# path = "/absolute/path/to/project"
# description = "Example project"
# Skill 位于目标仓库的 .agents/skills/<name>/SKILL.md；符号链接不得越出仓库，
# 且 SKILL.md 不得越出解析后的 skills 目录；留空则不指定。
# diagnosis_skill = "project-bugfix"
# --skill 只允许选择本仓库默认 Skill 或以下白名单中的名称。
# allowed_skills = ["canvas-bugfix", "performance-diagnosis"]
